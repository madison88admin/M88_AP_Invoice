<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <linearGradient id="top" x1="0" x2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#1f66d1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#152033" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1400" height="820" fill="#eef2f7"/>
  <rect x="60" y="48" width="1280" height="724" rx="28" fill="#fff" filter="url(#shadow)"/>
  <rect x="60" y="48" width="1280" height="112" rx="28" fill="url(#top)"/>
  <text x="100" y="112" font-family="Segoe UI, Arial" font-size="36" font-weight="700" fill="#fff">AP Invoice System - Easy Workflow</text>
  <text x="100" y="142" font-family="Segoe UI, Arial" font-size="17" fill="#dce8ff">Actual system function map: upload, OCR review, validation, approval, accounting review, payment batch, and audit trail.</text>

  <g font-family="Segoe UI, Arial">
    <rect x="100" y="205" width="170" height="98" rx="18" fill="#f7fbff" stroke="#9bb8e8" stroke-width="2"/>
    <text x="128" y="242" font-size="20" font-weight="700" fill="#174b91">1. Upload</text>
    <text x="128" y="270" font-size="15" fill="#5b6575">Add supplier PDF</text>

    <rect x="315" y="205" width="170" height="98" rx="18" fill="#f7fbff" stroke="#9bb8e8" stroke-width="2"/>
    <text x="343" y="242" font-size="20" font-weight="700" fill="#174b91">2. OCR Review</text>
    <text x="343" y="270" font-size="15" fill="#5b6575">Check extracted fields</text>

    <rect x="530" y="205" width="170" height="98" rx="18" fill="#f7fbff" stroke="#9bb8e8" stroke-width="2"/>
    <text x="558" y="242" font-size="20" font-weight="700" fill="#174b91">3. Validate</text>
    <text x="558" y="270" font-size="15" fill="#5b6575">System checks rules</text>

    <rect x="745" y="205" width="170" height="98" rx="18" fill="#f7fbff" stroke="#9bb8e8" stroke-width="2"/>
    <text x="773" y="242" font-size="20" font-weight="700" fill="#174b91">4. Approve</text>
    <text x="773" y="270" font-size="15" fill="#5b6575">Role approves/rejects</text>

    <rect x="960" y="205" width="170" height="98" rx="18" fill="#f7fbff" stroke="#9bb8e8" stroke-width="2"/>
    <text x="988" y="242" font-size="20" font-weight="700" fill="#174b91">5. Accounting</text>
    <text x="988" y="270" font-size="15" fill="#5b6575">Final review</text>

    <rect x="1175" y="205" width="125" height="98" rx="18" fill="#f7fbff" stroke="#9bb8e8" stroke-width="2"/>
    <text x="1202" y="242" font-size="20" font-weight="700" fill="#174b91">6. Pay</text>
    <text x="1202" y="270" font-size="15" fill="#5b6575">Batch/paid</text>

    <path d="M270 254 H315 M485 254 H530 M700 254 H745 M915 254 H960 M1130 254 H1175" stroke="#1f66d1" stroke-width="5" stroke-linecap="round"/>

    <rect x="420" y="390" width="560" height="112" rx="20" fill="#fff8ec" stroke="#e0ad34" stroke-width="2"/>
    <text x="470" y="432" font-size="24" font-weight="700" fill="#7a3f00">If may problem: Exceptions / On-Hold</text>
    <text x="470" y="464" font-size="16" fill="#5b6575">Resolve, waive with reason, correct invoice fields, or verify vendor/bank/MPO.</text>
    <path d="M615 303 V390" stroke="#e0ad34" stroke-width="5" stroke-linecap="round"/>

    <rect x="100" y="590" width="265" height="102" rx="18" fill="#f5f8fc" stroke="#d8e0eb"/>
    <text x="130" y="628" font-size="20" font-weight="700" fill="#162033">Dashboard</text>
    <text x="130" y="658" font-size="15" fill="#5b6575">See pending work and alerts</text>

    <rect x="405" y="590" width="265" height="102" rx="18" fill="#f5f8fc" stroke="#d8e0eb"/>
    <text x="435" y="628" font-size="20" font-weight="700" fill="#162033">Repository</text>
    <text x="435" y="658" font-size="15" fill="#5b6575">Search all invoices</text>

    <rect x="710" y="590" width="265" height="102" rx="18" fill="#f5f8fc" stroke="#d8e0eb"/>
    <text x="740" y="628" font-size="20" font-weight="700" fill="#162033">Reports</text>
    <text x="740" y="658" font-size="15" fill="#5b6575">Check totals and SLA</text>

    <rect x="1015" y="590" width="285" height="102" rx="18" fill="#f5f8fc" stroke="#d8e0eb"/>
    <text x="1045" y="628" font-size="20" font-weight="700" fill="#162033">Audit Logs</text>
    <text x="1045" y="658" font-size="15" fill="#5b6575">Who did what and when</text>
  </g>
</svg>
